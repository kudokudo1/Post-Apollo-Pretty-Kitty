# START_KITTY_THEME
include theme.conf
# END_KITTY_THEME

# Font
font_family      family="GohuFont 11 Nerd Font Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto

# Instrument mode
clear_all_shortcuts yes
clear_all_mouse_actions yes

window_padding_width 0
single_window_padding_width 0

hide_window_decorations yes
confirm_os_window_close 0

enable_audio_bell no
shell_integration disabled

# No terminal-style scrolling
scrollback_lines 0
scrollback_pager_history_size 0
scrollbar never

wheel_scroll_multiplier 0
touch_scroll_multiplier 0
momentum_scroll 0

detect_urls no

# Prevent the initial giant window
remember_window_size no
initial_window_width 780
initial_window_height 400

placement_strategy top-left
